<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="jarBody_4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="lidGrad_4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="200" cy="345" rx="115" ry="16" fill="url(#shadow)"/>

  <!-- Round Jar Lid -->
  <rect x="135" y="100" width="130" height="34" rx="8" fill="url(#lidGrad_4)" stroke="#EAB308" stroke-width="1.5"/>
  <ellipse cx="200" cy="100" rx="65" ry="10" fill="#FFFFFF" opacity="0.3"/>

  <!-- Glass/Tub Body -->
  <rect x="125" y="134" width="150" height="190" rx="16" fill="url(#jarBody_4)" stroke="#EAB308" stroke-width="1.5"/>

  <!-- Front Label Wrap -->
  <rect x="132" y="165" width="136" height="135" rx="10" fill="#FFFFFF" stroke="#EAB308" stroke-width="1"/>
  <rect x="132" y="172" width="136" height="38" fill="#EAB308"/>
  <text x="200" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GOWARDHAN</text>

  <!-- Seal / Badge -->
  <circle cx="200" cy="235" r="18" fill="#CA8A04"/>
  <text x="200" y="239" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">SHUDDH GHEE</text>

  <!-- Name & Unit -->
  <text x="200" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1E293B" text-anchor="middle">Cow Ghee</text>
  <text x="200" y="290" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">500 ml Jar</text>

  <!-- Specular Reflection Glare -->
  <rect x="132" y="145" width="18" height="170" rx="9" fill="url(#gloss)" opacity="0.7"/>
</svg>