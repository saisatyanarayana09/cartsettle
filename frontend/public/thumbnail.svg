<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14233c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0b111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Glow -->
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Glow -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="cart-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1280" height="720" fill="url(#bg-glow)"/>

  <!-- Subtle Minimalist Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="960" cy="360" r="220" fill="#06B6D4" opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="940" cy="340" r="140" fill="#10B981" opacity="0.16" filter="url(#glow-emerald)"/>

  <!-- ================= LEFT COLUMN: TYPOGRAPHY & VALUE PROP ================= -->
  <g transform="translate(100, 150)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="18" cy="18" r="4" fill="#34D399" filter="url(#glow-emerald)"/>
    <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="2">AI VOICE COMMERCE</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="url(#text-grad)" letter-spacing="-2">CARTSETTLE</text>

    <!-- Minimalist Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#38BDF8" letter-spacing="-0.5">Talk. Bargain. Settle.</text>

    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="0">
      Zero-Downtime Autonomous Retail Engine
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="185" height="42" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">🎙️ Live Voice AI</text>

      <!-- Pill 2 -->
      <rect x="198" y="0" width="195" height="42" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="216" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">🤝 Smart Bargaining</text>

      <!-- Pill 3 -->
      <rect x="406" y="0" width="185" height="42" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="424" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">⚡ 4-Tier Failover</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: HERO VISUAL GRAPHIC ================= -->
  <g transform="translate(920, 360)">
    <!-- Floating Voice Wave Rings -->
    <ellipse cx="0" cy="-60" rx="130" ry="25" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>
    <ellipse cx="0" cy="-60" rx="170" ry="32" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Voice AI Floating Orb -->
    <circle cx="0" cy="-60" r="42" fill="url(#accent-grad)" filter="url(#glow-emerald)"/>
    <circle cx="0" cy="-60" r="40" fill="#0B132B"/>
    <circle cx="0" cy="-60" r="30" fill="url(#accent-grad)" opacity="0.85"/>
    
    <!-- Sound Waves inside Orb -->
    <line x1="-16" y1="-60" x2="-16" y2="-60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="-72" x2="-8" y2="-48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-78" x2="0" y2="-42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="-72" x2="8" y2="-48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="-60" x2="16" y2="-60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Minimalist Holographic 3D Cart -->
    <g transform="translate(-105, 10)">
      <!-- Cart Basket Wireframe -->
      <path d="M 0 0 L 25 0 L 50 90 L 190 90 L 210 25 L 35 25" 
            fill="none" stroke="url(#cart-stroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)"/>
      
      <!-- Inner Grid Lines -->
      <line x1="42" y1="55" x2="202" y2="55" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.7"/>
      <line x1="80" y1="25" x2="72" y2="90" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.7"/>
      <line x1="125" y1="25" x2="120" y2="90" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.7"/>
      <line x1="170" y1="25" x2="165" y2="90" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.7"/>

      <!-- Lower Chassis -->
      <path d="M 50 90 L 65 120 L 175 120" fill="none" stroke="url(#cart-stroke)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cart Wheels -->
      <circle cx="80" cy="132" r="14" fill="#0B132B" stroke="#34D399" stroke-width="3.5" filter="url(#glow-emerald)"/>
      <circle cx="80" cy="132" r="4" fill="#34D399"/>
      
      <circle cx="160" cy="132" r="14" fill="#0B132B" stroke="#38BDF8" stroke-width="3.5" filter="url(#glow-cyan)"/>
      <circle cx="160" cy="132" r="4" fill="#38BDF8"/>
    </g>

    <!-- Floating Live Bargain Settlement Badge -->
    <g transform="translate(-170, 70)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="200" height="64" rx="14" fill="url(#card-glass)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
      
      <circle cx="28" cy="32" r="14" fill="#10B981" fill-opacity="0.2"/>
      <path d="M 22 32 L 26 36 L 34 27" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">DEAL SETTLED</text>
      <text x="52" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">₹48 <tspan font-size="13" font-weight="500" fill="#64748B" text-decoration="line-through">₹56</tspan> <tspan font-size="12" font-weight="700" fill="#34D399">-14%</tspan></text>
    </g>
  </g>
</svg>
