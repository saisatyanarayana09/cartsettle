<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CartSettle - Minimalist YouTube Thumbnail</title>
  <style>
    body {
      margin: 0;
      background: #05070D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .container {
      max-width: 1280px;
      width: 90%;
      text-align: center;
    }
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(16, 185, 129, 0.15);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1E293B;
    }
    .thumbnail-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #10B981 0%, #06B6D4 100%);
      color: #060911;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="font-weight: 700; letter-spacing: -0.5px; margin-bottom: 16px;">CartSettle YouTube Thumbnail (16:9 • 1280x720)</h2>
    <div class="thumbnail-wrapper" id="thumb">
      <img id="svgImg" src="./thumbnail.svg" alt="CartSettle YouTube Thumbnail" />
    </div>
    <div class="controls">
      <button onclick="downloadPNG()">Download High-Res PNG (1280x720)</button>
      <button style="background: #1E293B; color: #F8FAFC; border: 1px solid #334155;" onclick="window.open('./thumbnail.svg')">Open Raw SVG</button>
    </div>
    <p>Minimalist Design • High-Contrast Tech Typography • Holographic Cart & Voice AI Wave</p>
  </div>

  <canvas id="canvas" width="1280" height="720" style="display: none;"></canvas>

  <script>
    function downloadPNG() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1280, 720);
        const a = document.createElement('a');
        a.download = 'cartsettle-youtube-thumbnail.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = './thumbnail.svg?' + new Date().getTime();
    }
  </script>
</body>
</html>
